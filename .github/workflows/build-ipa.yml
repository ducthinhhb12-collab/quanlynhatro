name: Build iOS Native Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Standalone iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Build Web Bundle
        run: |
          npm run build

      - name: Archive iOS Source
        run: |
          tar -czf release-ios-app.tar.gz ios/

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnGiaSmartHome3D-iOS
          path: release-ios-app.tar.gz
          retention-days: 30
