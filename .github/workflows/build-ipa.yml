name: Build & Package iOS Native IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile iOS Native (.IPA) on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Build Web Bundle
        run: |
          npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Compile and Archive iOS Application
        run: |
          mkdir -p build
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .IPA Binary
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r -q ../AnGiaSmartHome3D.ipa Payload
          cd ..
          shasum -a 256 AnGiaSmartHome3D.ipa > AnGiaSmartHome3D.ipa.sha256
          ls -lh AnGiaSmartHome3D.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnGiaSmartHome3D-IPA
          path: |
            AnGiaSmartHome3D.ipa
            AnGiaSmartHome3D.ipa.sha256
          retention-days: 30

      - name: Release IPA to GitHub Releases (if Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AnGiaSmartHome3D.ipa
            AnGiaSmartHome3D.ipa.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
