name: Build & Release Android Native APK (Debug CI)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Accept Android SDK Licenses & Configure local.properties
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479edd1c70d5fb0c374476572049e14f\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Build Web Bundle
        run: |
          npm run build

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Sync Web Assets to Android
        run: |
          npx cap sync android || true
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Report Build Diagnostics as GitHub Annotation
        if: always()
        run: |
          if [ -f gradle_build.log ]; then
            WHAT_FAILED=$(grep -A 8 "* What went wrong:" gradle_build.log | tr '\n' ' ' | head -c 1000)
            echo "::error title=WhatWentWrong::$WHAT_FAILED"
            CAUSED_BY=$(grep -A 4 "Caused by:" gradle_build.log | head -n 12 | tr '\n' ' ' | head -c 1000)
            echo "::warning title=GradleCausedBy::$CAUSED_BY"
          fi

      - name: Publish Gradle Build Log to Step Summary
        if: always()
        run: |
          echo "## 📋 Gradle Build Log Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f gradle_build.log ]; then
            tail -n 120 gradle_build.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No gradle_build.log found." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK for Release
        run: |
          mkdir -p release
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: No APK file found in android/app/build/outputs/apk!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" release/AnGiaSmartHome3D.apk
          ls -la release/AnGiaSmartHome3D.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnGiaSmartHome3D-APK
          path: release/AnGiaSmartHome3D.apk
          retention-days: 30

      - name: Release APK to GitHub Releases (Rolling Update on Every Push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('An Gia Smart Home 3D {0}', github.ref_name) || format('An Gia Smart Home 3D Mobile APK (Build #{0})', github.run_number) }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'app-latest' }}
          draft: false
          prerelease: false
          make_latest: true
          files: release/AnGiaSmartHome3D.apk
          body: |
            ## 🚀 Bản Cập Nhật Tự Động Cho Điện Thoại (Build #${{ github.run_number }})
            - **Tên tệp cài đặt:** `AnGiaSmartHome3D.apk`
            - **Commit SHA:** `${{ github.sha }}`
            - **Kiến trúc:** Capacitor 8 + React 19 + Three.js 3D (Offline-first / Zero-server)
            - **Bảo toàn dữ liệu người dùng 100%:** Cài đè trực tiếp lên ứng dụng cũ trên máy mà không cần gỡ bỏ. Toàn bộ thông tin 12 phòng, danh bạ khách thuê, chỉ số điện nước, tài khoản ngân hàng VietQR và cấu hình Zalo được giữ nguyên vẹn tuyệt đối.
            - **Cách cài đặt:** Tải file `AnGiaSmartHome3D.apk` về điện thoại Android, chạm mở file và chọn **Cập nhật** (hoặc Cài đặt).
