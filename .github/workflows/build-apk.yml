name: Build & Release Android Native APK

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Build Web Bundle
        run: |
          npm run build

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Sync Web Assets to Android
        run: |
          npx cap sync android || true
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/AnGiaSmartHome3D.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnGiaSmartHome3D-APK
          path: release/AnGiaSmartHome3D.apk
          retention-days: 30

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: "An Gia Smart Home 3D Native Android APK"
          tag_name: "v1.0.0"
          draft: false
          prerelease: false
          files: release/AnGiaSmartHome3D.apk
          body: |
            ## 🎉 Bản Cài Đặt Android Native Độc Lập (An Gia Smart Home 3D)
            - **Tên tệp:** `AnGiaSmartHome3D.apk`
            - **Kiến trúc:** Capacitor 8 + React 19 + Three.js 3D (Offline-first / Zero-server)
            - **Cách cài đặt:** Tải file `.apk` về điện thoại Android, chạm mở file và chọn **Cài đặt**.
