name: Build & Release Android Native APK

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Accept Android SDK Licenses & Configure local.properties
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479edd1c70d5fb0c374476572049e14f\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Build Web Bundle
        run: |
          npm run build

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Sync Web Assets to Android
        run: |
          npx cap sync android || true
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Publish Gradle Build Log to Step Summary
        if: always()
        run: |
          echo "## 📋 Gradle Build Log Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f gradle_build.log ]; then
            tail -n 120 gradle_build.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No gradle_build.log found." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Save Debug Log to Branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-debug-log
          cp gradle_build.log debug.log 2>/dev/null || echo "No gradle_build.log" > debug.log
          git add debug.log
          git commit -m "chore(debug): add build log" || true
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git build-debug-log || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK for Release
        run: |
          mkdir -p release
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: No APK file found in android/app/build/outputs/apk!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" release/AnGiaSmartHome3D.apk
          ls -la release/AnGiaSmartHome3D.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnGiaSmartHome3D-APK
          path: release/AnGiaSmartHome3D.apk
          retention-days: 30

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: "An Gia Smart Home 3D Native Android APK"
          tag_name: "v1.0.0"
          draft: false
          prerelease: false
          files: release/AnGiaSmartHome3D.apk
          body: |
            ## 🎉 Bản Cài Đặt Android Native Độc Lập (An Gia Smart Home 3D)
            - **Tên tệp:** `AnGiaSmartHome3D.apk`
            - **Kiến trúc:** Capacitor 8 + React 19 + Three.js 3D (Offline-first / Zero-server)
            - **Cách cài đặt:** Tải file `.apk` về điện thoại Android, chạm mở file và chọn **Cài đặt**.
